<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769e0">
<title>麻雀スコア計算</title>
<style>
:root{--b:#1769e0;--g:#087a55;--r:#d33;--l:#d7e0e8;--p:#fff;--bg:#f4f7fa;--t:#17212b;--m:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:980px;margin:auto;padding:12px}h1{font-size:21px;margin:4px 0 12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat,section{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:12px}.stat{text-align:center}.stat small{display:block;color:var(--m)}.stat strong{font-size:22px}section{margin-top:10px}.title{font-size:18px;font-weight:800;margin-bottom:8px}.entry{display:grid;grid-template-columns:minmax(260px,1fr) 250px;gap:12px}.head,.person{display:grid;grid-template-columns:1.35fr 1fr;gap:8px}.head{font-size:12px;color:var(--m);margin-bottom:4px}.person{margin-bottom:8px}input,select{width:100%;min-width:0;border:1px solid var(--l);border-radius:10px;padding:11px;font-size:16px;background:#fff;color:var(--t)}input::placeholder{color:var(--m);opacity:.75}input.score{cursor:pointer;caret-color:transparent}input.score.active{border:2px solid var(--b);background:#f5f9ff}input.score:disabled{opacity:1;background:#eaf2ff;color:#1557aa;font-weight:800}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-content:start}.keypad button{min-height:48px;font-size:19px;background:#fff;border:1px solid var(--l)}button{border:0;border-radius:10px;padding:11px;font-weight:800;cursor:pointer;touch-action:manipulation}.keypad .minus{color:var(--r)}.keypad .subkey{font-size:13px}.actions{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:10px}.primary{background:var(--b);color:#fff}.secondary{background:#e8edf2;color:#334155}.warn{background:#fff4df;color:#805000;border:1px solid #edca85}.danger{background:#fff0f0;color:var(--r);border:1px solid #ffcaca}.armed{background:var(--r);color:#fff}.small{padding:7px 9px;font-size:11px}.msg{min-height:20px;color:var(--r);font-size:13px;margin-top:8px}.tie{display:none;background:#fff8e8;border:1px solid #efd18c;border-radius:10px;padding:10px;margin-top:9px}.tie.show{display:block}.tie select{margin:8px 0}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px;font-size:13px}th,td{border:1px solid var(--l);padding:8px;text-align:center;white-space:nowrap}th{background:var(--bg)}tfoot th,tfoot td{font-weight:900;border-top:2px solid var(--t)}.plus{color:var(--g);font-weight:800}.minuspoint{color:var(--r);font-weight:800}.ops{display:flex;gap:4px;justify-content:center}.foot{text-align:right;margin-top:9px}.empty{text-align:center;color:var(--m);padding:16px}.note{font-size:12px;color:var(--m);margin-top:7px}
@media(max-width:640px){.app{padding:4px}h1{font-size:17px;margin:2px 0 6px}.stats{gap:5px}.stat,section{padding:6px;border-radius:9px}section{margin-top:5px}.title{font-size:14px;margin-bottom:4px}section:last-of-type{padding:6px 5px}section:last-of-type .title{margin-bottom:4px}section:last-of-type table{min-width:0;table-layout:fixed;font-size:10px}section:last-of-type th,section:last-of-type td{padding:3px 1px;overflow:hidden;text-overflow:ellipsis}section:last-of-type th:first-child,section:last-of-type td:first-child{width:26px}section:last-of-type th:last-child,section:last-of-type td:last-child{width:54px}section:last-of-type .ops{gap:1px}section:last-of-type .ops .small{padding:3px 2px;font-size:9px;border-radius:5px}section:last-of-type .empty{padding:8px 4px;font-size:11px}section:last-of-type .foot{margin-top:4px}section:last-of-type .foot .small{padding:4px 7px;font-size:10px}section:last-of-type .note{margin-top:3px;font-size:10px}.entry{grid-template-columns:1fr 122px;gap:5px}.people{grid-column:2}.keypad{grid-column:1;grid-row:1}.head{display:none}.person{grid-template-columns:1fr;gap:2px;margin-bottom:4px}.person input,.person select{padding:7px 5px;font-size:16px}.keypad{gap:4px}.keypad button{min-height:38px;padding:3px;font-size:16px}.actions{gap:5px;margin-top:6px}.actions button{padding:8px;font-size:13px}}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--p:#1b2533;--l:#334155;--t:#edf2f7;--m:#a5b4c5}input,select,.keypad button{background:#1b2533;color:#edf2f7}.secondary{background:#334155;color:#fff}input.score.active,input.score:disabled{background:#223a5e;color:#b9d3ff}}
</style>
</head>
<body><main class="app">
<h1>麻雀スコア計算</h1>
<div class="stats"><div class="stat"><small>ゲーム数</small><strong id="gameCount">0</strong></div><div class="stat"><small>累積場代</small><strong id="feeTotal">0</strong></div></div>
<section><div class="title" id="formTitle">今回の結果を入力</div>
<div class="entry"><div class="keypad" id="keypad" aria-label="素点入力テンキー">
<button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
<button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
<button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
<button type="button" class="minus" data-key="-">−</button><button type="button" data-key="0">0</button><button type="button" data-key=".">.</button>
<button type="button" class="subkey" data-action="back">1文字消す</button><button type="button" class="subkey" data-action="clear">クリア</button><button type="button" class="subkey" data-action="next">次へ</button>
</div><div class="people"><div class="head"><span>名前</span><span>素点</span></div><div id="inputs"></div></div></div>
<div class="tie" id="tie"><strong>同点です。上位になる人を選んでください</strong><select id="tieSelect"></select><button type="button" class="warn" id="tieGo">選択して続ける</button></div>
<div class="actions"><button type="button" class="primary" id="save">計算してゲームを追加</button><button type="button" class="secondary" id="clearScores">素点を消す</button></div><div class="msg" id="message" aria-live="polite"></div></section>
<section><div class="title">過去の戦績</div><div class="wrap" id="grid"><div class="empty">ゲームを追加すると戦績表が表示されます。</div></div><div class="foot"><button type="button" class="danger small" id="reset">全戦績を削除</button></div><div class="note">戦績と名前はこのブラウザ内に保存されます。</div></section>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), fee=10, uma=[20,10,-10,-20], KEY='mahjong-score-v1', NAMES_KEY='mahjong-names-v1';
const state={games:load(),edit:-1,auto:-1,active:0,pending:null,ties:[],orders:{},armed:null,timer:null};
function loadNames(){try{const x=JSON.parse(localStorage.getItem(NAMES_KEY)||'["","","",""]');return Array.isArray(x)&&x.length===4?x.map(v=>String(v||'')):['','','','']}catch(e){return['','','','']}}
function saveNames(){localStorage.setItem(NAMES_KEY,JSON.stringify([0,1,2,3].map(i=>$('name'+i).value.trim())))}
const savedNames=loadNames();
for(let i=0;i<4;i++){const row=document.createElement('div');row.className='person';row.innerHTML='<input id="name'+i+'" value="'+esc(savedNames[i])+'" placeholder="プレイヤー'+(i+1)+'" maxlength="12" aria-label="名前'+(i+1)+'"><input id="score'+i+'" class="score" type="text" inputmode="none" readonly aria-label="素点'+(i+1)+'">';$('inputs').appendChild(row);$('name'+i).addEventListener('input',saveNames)}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state.games))}
function score(i){return $('score'+i)} function fields(){return [0,1,2,3].map(score)}
function activate(i){if(i<0||i>3||score(i).disabled)return;state.active=i;fields().forEach((e,j)=>e.classList.toggle('active',j===i))}
fields().forEach((e,i)=>e.addEventListener('click',()=>activate(i)));activate(0);
function updateAuto(){if(state.auto>=0){const old=score(state.auto);old.disabled=false;old.value='';state.auto=-1}const f=fields(),filled=f.filter(e=>e.value.trim()!=='').length;if(filled===3){const blank=f.findIndex(e=>e.value.trim()===''),vals=f.map(e=>e.value.trim()===''?0:Number(e.value));if(blank>=0&&vals.every(Number.isFinite)){score(blank).value=(Math.round((100-vals.reduce((a,b)=>a+b,0))*10)/10).toFixed(1);score(blank).disabled=true;state.auto=blank}}}
function typeKey(k){const e=score(state.active);if(!e||e.disabled)return;let v=e.value;if(k==='-')e.value=v.startsWith('-')?v.slice(1):'-'+v;else if(k==='.') {if(!v.includes('.'))e.value=(v===''||v==='-')?v+'0.':v+'.'} else {if(v==='0')v='';if(v==='-0')v='-';e.value=v+k}updateAuto()}
$('keypad').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const k=b.dataset.key,a=b.dataset.action;if(k!==undefined)typeKey(k);else if(a==='back'){const e=score(state.active);if(!e.disabled){e.value=e.value.slice(0,-1);updateAuto()}}else if(a==='clear'){const e=score(state.active);if(!e.disabled){e.value='';updateAuto()}}else if(a==='next'){for(let j=1;j<=4;j++){const n=(state.active+j)%4;if(!score(n).disabled){activate(n);break}}}});
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rnd(v){return (v<0?-1:1)*Math.floor(Math.abs(v)+.4+1e-9)} function fmt(v){v=Math.abs(v)<1e-9?0:v;return(v>0?'+':'')+v.toFixed(0)} function cls(v){return v>0?'plus':v<0?'minuspoint':''}
function clearScores(){fields().forEach(e=>{e.disabled=false;e.value='';e.classList.remove('active')});state.auto=-1;$('tie').classList.remove('show');$('message').textContent='';activate(0)}
function read(){updateAuto();if(state.auto<0)throw Error('3人分の素点を入力してください。');saveNames();const a=[];for(let i=0;i<4;i++){const name=$('name'+i).value.trim()||'プレイヤー'+(i+1),raw=Number(score(i).value);if(!Number.isFinite(raw))throw Error('素点を確認してください。');a.push({name,raw,original:i})}if(new Set(a.map(p=>p.name)).size!==4)throw Error('名前は4人とも異なる名前にしてください。');return a}
function prepare(a){state.pending=a;state.ties=[];state.orders={};const groups={};a.forEach(p=>(groups[p.raw.toFixed(1)]||(groups[p.raw.toFixed(1)]=[])).push(p));Object.values(groups).forEach(g=>{if(g.length>1)state.ties.push(g)});state.ties.length?showTie():commit()}
function showTie(){const g=state.ties[0];$('tieSelect').innerHTML=g.map(p=>'<option value="'+p.original+'">'+esc(p.name)+'</option>').join('');$('tie').classList.add('show')}
$('tieGo').addEventListener('click',()=>{const g=state.ties.shift(),selected=Number($('tieSelect').value),ordered=g.slice().sort((a,b)=>a.original===selected?-1:b.original===selected?1:a.original-b.original);state.orders[g[0].raw.toFixed(1)]=ordered.map(p=>p.original);state.ties.length?showTie():($('tie').classList.remove('show'),commit())});
function commit(){const a=state.pending.slice().sort((x,y)=>{if(y.raw!==x.raw)return y.raw-x.raw;const o=state.orders[x.raw.toFixed(1)]||[];return o.indexOf(x.original)-o.indexOf(y.original)});a.forEach((p,i)=>p.point=rnd(p.raw-30)+uma[i]);a[0].point=-(a[1].point+a[2].point+a[3].point)-fee;const game={result:a.map(p=>({name:p.name,raw:p.raw,point:p.point,original:p.original}))};if(state.edit>=0)state.games[state.edit]=game;else state.games.push(game);state.edit=-1;$('formTitle').textContent='今回の結果を入力';$('save').textContent='計算してゲームを追加';persist();clearScores();render()}
function names(){const a=[];state.games.forEach(g=>g.result.forEach(p=>{if(!a.includes(p.name))a.push(p.name)}));return a}
function render(){ $('gameCount').textContent=state.games.length;$('feeTotal').textContent=state.games.length*fee;if(!state.games.length){$('grid').innerHTML='<div class="empty">ゲームを追加すると戦績表が表示されます。</div>';return}const ns=names(),tot={};ns.forEach(n=>tot[n]=0);let h='<table><thead><tr><th>ゲーム</th>'+ns.map(n=>'<th>'+esc(n)+'</th>').join('')+'<th>操作</th></tr></thead><tbody>';state.games.forEach((g,i)=>{const m={};g.result.forEach(p=>{m[p.name]=p.point;tot[p.name]+=p.point});h+='<tr><th>'+(i+1)+'</th>'+ns.map(n=>m[n]===undefined?'<td>－</td>':'<td class="'+cls(m[n])+'">'+fmt(m[n])+'</td>').join('')+'<td><div class="ops"><button type="button" class="warn small" data-edit="'+i+'">修正</button><button type="button" class="'+(state.armed===i?'armed':'danger')+' small" data-delete="'+i+'">'+(state.armed===i?'もう一度押す':'削除')+'</button></div></td></tr>'});h+='</tbody><tfoot><tr><th>合計</th>'+ns.map(n=>'<td class="'+cls(tot[n])+'">'+fmt(tot[n])+'</td>').join('')+'<td></td></tr></tfoot></table>';$('grid').innerHTML=h}
$('save').addEventListener('click',()=>{try{$('message').textContent='';prepare(read())}catch(e){$('message').textContent=e.message}});$('clearScores').addEventListener('click',clearScores);
$('grid').addEventListener('click',e=>{const edit=e.target.dataset.edit,del=e.target.dataset.delete;if(edit!==undefined){const i=Number(edit),g=state.games[i];state.edit=i;clearScores();g.result.forEach(p=>{$('name'+p.original).value=p.name;if(p.original!==0)score(p.original).value=p.raw.toFixed(1)});updateAuto();$('formTitle').textContent='第'+(i+1)+'ゲームを修正';$('save').textContent='修正内容で再計算';scrollTo({top:0,behavior:'smooth'})}if(del!==undefined){const i=Number(del);if(state.armed===i){clearTimeout(state.timer);state.games.splice(i,1);state.armed=null;state.edit=-1;persist();clearScores();render()}else{state.armed=i;render();state.timer=setTimeout(()=>{state.armed=null;render()},3000)}}});
$('reset').addEventListener('click',()=>{if(!state.games.length)return;if(state.armed==='all'){clearTimeout(state.timer);state.games=[];state.armed=null;state.edit=-1;persist();clearScores();render();$('reset').textContent='全戦績を削除';$('reset').classList.remove('armed')}else{state.armed='all';$('reset').textContent='もう一度押すと全削除';$('reset').classList.add('armed');state.timer=setTimeout(()=>{state.armed=null;$('reset').textContent='全戦績を削除';$('reset').classList.remove('armed')},3000)}});
render();
})();
</script></body></html>
